name: sky-takeout

# 只跑基础设施。表结构由后端 Flyway 迁移脚本负责
# (backend/src/main/resources/db/migration),不在这里灌 SQL。
#
# 刻意不写 container_name:交给 compose 按项目名生成(sky-takeout-mysql-1),
# 避免和机器上其它 compose 项目的同名容器互相抢占。
# 需要在容器里执行命令时用服务名即可,例如:
#   wsl docker compose -f /mnt/d/projects/sky-takeout/docker-compose.yml exec mysql mysql -uroot -proot
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sky_takeout
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
