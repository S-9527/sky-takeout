server:
  port: 8080

spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: ${sky.datasource.driver-class-name}
    url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${sky.datasource.username}
    password: ${sky.datasource.password}
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      password: ${sky.redis.password}
      database: ${sky.redis.database}

mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.sky.employee.entity,com.sky.menu.entity,com.sky.user.entity,com.sky.order.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info

sky:
  jwt:
    # JWT 受众
    audience: sky-takeout
    # 管理端
    admin-issuer: sky-admin
    admin-ttl: 1800000
    admin-refresh-ttl: 604800000
    admin-keys:
      - kid: admin-2026
        # 建议通过环境变量注入,勿在源码仓库暴露生产密钥
        secret: ${SKY_JWT_ADMIN_SECRET:itcast-sky-takeout-admin-2026-32bytes!!}
    # 用户端
    user-issuer: sky-user
    user-ttl: 1800000
    user-refresh-ttl: 604800000
    user-keys:
      - kid: user-2026
        secret: ${SKY_JWT_USER_SECRET:itheima-sky-takeout-user-2026-32bytes!!}
  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}
  wechat:
    # 登录方式: mock(默认, 本地开发, jsCode 直接映射 openid, 无需微信配置) / wechat(线上, 真实 jscode2session)
    # 切换:--sky.wechat.login=wechat 或环境变量 WECHAT_LOGIN=wechat
    login: ${WECHAT_LOGIN:mock}
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
    mchid : ${sky.wechat.mchid}
    mchSerialNo: ${sky.wechat.mchSerialNo}
    privateKeyFilePath: ${sky.wechat.privateKeyFilePath}
    apiV3Key: ${sky.wechat.apiV3Key}
    weChatPayCertFilePath: ${sky.wechat.weChatPayCertFilePath}
    notifyUrl: ${sky.wechat.notifyUrl}
    refundNotifyUrl: ${sky.wechat.refundNotifyUrl}
  shop:
    address: 北京市海淀区上地十街10号
  baidu:
    ak: your-ak
  pay:
    # 支付网关: mock(默认, 本地开发, 支付即成功) / wechat(线上, 真实微信支付, 需商户证书)
    # 切换:--sky.pay.gateway=wechat 或环境变量 PAY_GATEWAY=wechat
    gateway: ${PAY_GATEWAY:mock}
  oss:
    # 文件存储: local(默认, 本地磁盘, 无需云账号) / aliyun(线上, 阿里云 OSS)
    # 切换:--sky.oss.storage=aliyun 或环境变量 OSS_STORAGE=aliyun
    storage: ${OSS_STORAGE:local}
    local-dir: ${OSS_LOCAL_DIR:./data/upload}
